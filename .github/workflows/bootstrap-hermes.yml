# Registered on the default branch so feature-branch push events can run.
name: Bootstrap Hermes runtime and CFO overlay

on:
  push:
    branches:
      - feat/cfo-hermes-bootstrap
    paths:
      - ".github/workflows/bootstrap-hermes.yml"
      - ".cfo/overlay.tar.gz.b64"
      - ".cfo/delta-v0.2.0/**"
  pull_request:
    branches:
      - main
    types:
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfo-hermes-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-and-customize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CFOAgent seed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Import Hermes Agent main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hermes-agent /tmp/upstream-readme.md
          git clone --depth=1 --single-branch --branch main \
            https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          cp /tmp/hermes-agent/README.md /tmp/upstream-readme.md
          UPSTREAM_SHA="$(git -C /tmp/hermes-agent rev-parse HEAD)"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cfo/' \
            --exclude='.github/workflows/' \
            /tmp/hermes-agent/ ./

          cp /tmp/upstream-readme.md UPSTREAM_README.md

      - name: Assemble and validate CFO base plus v0.2 delta
        shell: bash
        run: |
          set -euo pipefail
          test -s .cfo/overlay.tar.gz.b64

          parts=(
            .cfo/delta-v0.2.0/part-00
            .cfo/delta-v0.2.0/part-01
            .cfo/delta-v0.2.0/part-01a
            .cfo/delta-v0.2.0/part-02
            .cfo/delta-v0.2.0/part-03
            .cfo/delta-v0.2.0/part-03a
            .cfo/delta-v0.2.0/part-03b
            .cfo/delta-v0.2.0/part-04a
            .cfo/delta-v0.2.0/part-04b
            .cfo/delta-v0.2.0/part-05a
            .cfo/delta-v0.2.0/part-05b
            .cfo/delta-v0.2.0/part-06
          )

          for part in "${parts[@]}"; do
            test -s "$part" || { echo "Missing payload part: $part" >&2; exit 1; }
          done

          delta_b64="$RUNNER_TEMP/cfo-v0.2-delta.tar.gz.b64"
          cat "${parts[@]}" | tr -d '\r\n\t ' > "$delta_b64"
          echo "CFO_DELTA_B64_PATH=$delta_b64" >> "$GITHUB_ENV"
          echo "PAYLOAD_PART_COUNT=${#parts[@]}" >> "$GITHUB_ENV"

          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          ALLOWED_WORKFLOWS = {".github/workflows/cfo-ci.yml"}

          def decode_payload(path: Path, label: str) -> tuple[bytes, int]:
              encoded = "".join(path.read_text(encoding="ascii").split())
              if "=" in encoded.rstrip("="):
                  raise SystemExit(f"{label} contains embedded base64 padding")
              padding = (-len(encoded)) % 4
              encoded += "=" * padding
              try:
                  raw = base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  raise SystemExit(f"Invalid base64 in {label}: {exc}") from exc
              if raw[:2] != b"\x1f\x8b":
                  raise SystemExit(f"{label} is not a gzip archive")
              return raw, padding

          def inspect_archive(raw: bytes, label: str) -> set[str]:
              names: set[str] = set()
              try:
                  archive = tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz")
              except tarfile.TarError as exc:
                  raise SystemExit(f"Invalid tar archive in {label}: {exc}") from exc

              with archive:
                  for member in archive.getmembers():
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"Unsafe path in {label}: {member.name}")
                      if member.issym() or member.islnk():
                          raise SystemExit(f"Links are not allowed in {label}: {member.name}")
                      normalized = member.name[2:] if member.name.startswith("./") else member.name
                      normalized = normalized.rstrip("/")
                      if normalized.startswith(".git/"):
                          raise SystemExit(f"Protected path in {label}: {member.name}")
                      if (
                          normalized.startswith(".github/workflows/")
                          and normalized not in ALLOWED_WORKFLOWS
                      ):
                          raise SystemExit(f"Protected workflow in {label}: {member.name}")
                      names.add(normalized)
              return names

          base_raw, base_padding = decode_payload(
              Path(".cfo/overlay.tar.gz.b64"), "CFO base overlay"
          )
          delta_raw, delta_padding = decode_payload(
              Path(os.environ["CFO_DELTA_B64_PATH"]), "CFO v0.2 delta"
          )

          base_names = inspect_archive(base_raw, "CFO base overlay")
          delta_names = inspect_archive(delta_raw, "CFO v0.2 delta")

          base_required = {
              "cfo_agent/cli.py",
              "scripts/patch_upstream.py",
              "scripts/sync_upstream.py",
          }
          missing_base = sorted(base_required - base_names)
          if missing_base:
              raise SystemExit(
                  "CFO base overlay is incomplete; missing: " + ", ".join(missing_base)
              )

          if "cfo_agent/__init__.py" not in delta_names:
              raise SystemExit("CFO v0.2 delta is missing cfo_agent/__init__.py")
          delta_skill_docs = sorted(
              name for name in delta_names if name.endswith("/SKILL.md")
          )
          if not delta_skill_docs:
              raise SystemExit("CFO v0.2 delta contains no SKILL.md files")

          base_archive = Path(os.environ["RUNNER_TEMP"]) / "cfo-base-overlay.tar.gz"
          delta_archive = Path(os.environ["RUNNER_TEMP"]) / "cfo-v0.2-delta.tar.gz"
          base_archive.write_bytes(base_raw)
          delta_archive.write_bytes(delta_raw)

          base_digest = hashlib.sha256(base_raw).hexdigest()
          delta_digest = hashlib.sha256(delta_raw).hexdigest()
          Path(".cfo/overlay.sha256").write_text(
              f"{base_digest}  cfo-base-overlay.tar.gz\n"
              f"{delta_digest}  cfo-v0.2-delta.tar.gz\n",
              encoding="ascii",
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CFO_BASE_ARCHIVE={base_archive}\n")
              env_file.write(f"CFO_DELTA_ARCHIVE={delta_archive}\n")
              env_file.write(f"CFO_BASE_SHA256={base_digest}\n")
              env_file.write(f"CFO_DELTA_SHA256={delta_digest}\n")
              env_file.write(f"CFO_BASE_PADDING={base_padding}\n")
              env_file.write(f"CFO_DELTA_PADDING={delta_padding}\n")
              env_file.write(f"DELTA_SKILL_DOC_COUNT={len(delta_skill_docs)}\n")

          print(
              "Validated CFO payloads: "
              f"base={len(base_raw):,} bytes, delta={len(delta_raw):,} bytes, "
              f"delta_skill_docs={len(delta_skill_docs)}"
          )
          PY

      - name: Apply CFO base, v0.2 delta, and official finance skills
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$CFO_BASE_ARCHIVE" -C .
          tar -xzf "$CFO_DELTA_ARCHIVE" -C .
          python scripts/patch_upstream.py --upstream-sha "$UPSTREAM_SHA"

          test -d optional-skills/finance
          rm -rf skills/finance-official
          mkdir -p skills/finance-official
          cp -a optional-skills/finance/. skills/finance-official/

          cat > THIRD_PARTY_FINANCE_SKILLS.md <<'EOF'
          # Third-Party Finance Skills

          CFOAgent activates the official finance skills shipped by NousResearch/hermes-agent.
          Their original author, license metadata, and source instructions are preserved in each
          copied `SKILL.md`. At the time of bootstrap these include stock research, Excel and
          PowerPoint authoring, DCF, comparable-company analysis, three-statement, LBO, and merger
          modeling skills. Those upstream skills are Apache-2.0 licensed; the Hermes runtime is MIT
          licensed. CFOAgent-specific additions remain governed by this repository's notices.
          EOF

          if ! grep -q '^# CFOAgent tracked examples$' .gitignore; then
            cat >> .gitignore <<'EOF'

          # CFOAgent tracked examples
          !examples/
          !examples/sample_financials.csv
          !examples/sample_budget.csv
          !examples/sample_long_thai.csv
          !examples/sample_cash_13_week.csv
          EOF
          fi

          python - <<'PY'
          from pathlib import Path
          import subprocess
          from scripts.sync_upstream import is_preserved

          raw = subprocess.check_output(
              ["git", "-C", "/tmp/hermes-agent", "ls-files", "-z"]
          ).decode("utf-8").split("\0")
          imported = sorted(path for path in raw if path and not is_preserved(path))
          Path(".cfo/upstream-files.txt").write_text(
              "\n".join(imported) + "\n", encoding="utf-8"
          )
          PY

      - name: Verify deterministic CFO layer and skill catalog
        shell: bash
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          python -m compileall -q cfo_agent scripts/patch_upstream.py scripts/sync_upstream.py
          python -m unittest discover -s tests/cfo_agent -v
          python -m cfo_agent.cli --home "$RUNNER_TEMP/cfohome" demo \
            --output "$RUNNER_TEMP/board-pack.md"
          python -m cfo_agent.cli --home "$RUNNER_TEMP/cfohome" cash13 \
            examples/sample_cash_13_week.csv --output "$RUNNER_TEMP/cash13.md"
          test -s "$RUNNER_TEMP/board-pack.md"
          test -s "$RUNNER_TEMP/cash13.md"

          python - <<'PY'
          from pathlib import Path
          import os

          all_skills = sorted(Path("skills").rglob("SKILL.md"))
          official_finance = sorted(Path("skills/finance-official").glob("*/SKILL.md"))
          if len(all_skills) < 99:
              raise SystemExit(f"Expected at least 99 active skills, found {len(all_skills)}")
          if len(official_finance) < 8:
              raise SystemExit(
                  f"Expected at least 8 official finance skills, found {len(official_finance)}"
              )

          malformed = []
          for path in official_finance:
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n") or "\nname:" not in text[:1500] or "\nlicense:" not in text[:1500]:
                  malformed.append(str(path))
          if malformed:
              raise SystemExit("Malformed official finance skills: " + ", ".join(malformed))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ACTIVE_SKILL_COUNT={len(all_skills)}\n")
              env_file.write(f"OFFICIAL_FINANCE_SKILL_COUNT={len(official_finance)}\n")
          print(
              f"Active skills: {len(all_skills)}; "
              f"official finance skills: {len(official_finance)}"
          )
          PY

          printf 'passed\nupstream=%s\nbase_payload=%s\ndelta_payload=%s\nskills=%s\nofficial_finance=%s\n' \
            "$UPSTREAM_SHA" "$CFO_BASE_SHA256" "$CFO_DELTA_SHA256" \
            "$ACTIVE_SKILL_COUNT" "$OFFICIAL_FINANCE_SKILL_COUNT" \
            > .cfo/bootstrap-status

      - name: Commit imported runtime and CFO system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CFOAgent Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          for sample in \
            examples/sample_financials.csv \
            examples/sample_budget.csv \
            examples/sample_long_thai.csv \
            examples/sample_cash_13_week.csv; do
            if [[ -f "$sample" ]]; then
              git add -f -- "$sample"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: import Hermes runtime and activate CFO finance skills"
          target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target_branch}"

      - name: Write bootstrap summary
        shell: bash
        run: |
          {
            echo "## CFOAgent bootstrap"
            echo ""
            echo "- Hermes upstream: \`$UPSTREAM_SHA\`"
            echo "- CFO base payload: \`$CFO_BASE_SHA256\`"
            echo "- CFO v0.2 delta: \`$CFO_DELTA_SHA256\` from $PAYLOAD_PART_COUNT verified parts"
            echo "- CFO skill documents in delta: $DELTA_SKILL_DOC_COUNT"
            echo "- Active skill catalog: $ACTIVE_SKILL_COUNT skills"
            echo "- Official finance skills activated: $OFFICIAL_FINANCE_SKILL_COUNT"
            echo "- Deterministic tests and 13-week cash forecast smoke test: passed"
            echo "- Runtime copied without upstream workflow files"
          } >> "$GITHUB_STEP_SUMMARY"
