# Runs from the default branch and checks out the PR head explicitly.
name: Bootstrap Hermes runtime and CFO source

on:
  pull_request:
    branches: [main]
    types: [reopened]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Existing branch to update
        required: false
        default: feat/cfo-hermes-bootstrap

permissions:
  contents: write

concurrency:
  group: cfo-hermes-bootstrap-${{ github.event_name }}-${{ github.head_ref || inputs.target_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  import-and-customize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve target branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="${{ github.head_ref }}"
          else
            target="${{ inputs.target_branch }}"
          fi
          test -n "$target"
          echo "TARGET_BRANCH=$target" >> "$GITHUB_ENV"

      - name: Checkout CFOAgent source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || inputs.target_branch }}
          fetch-depth: 0

      - name: Import current Hermes Agent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hermes-agent /tmp/upstream-readme.md
          git clone --depth=1 --single-branch --branch main \
            https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          cp /tmp/hermes-agent/README.md /tmp/upstream-readme.md
          UPSTREAM_SHA="$(git -C /tmp/hermes-agent rev-parse HEAD)"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cfo/' \
            --exclude='.github/workflows/' \
            --exclude='cfo_agent/' \
            --exclude='tests/cfo_agent/' \
            --exclude='skills/finance-cfo/' \
            --exclude='skills/finance-official/' \
            --exclude='scripts/patch_upstream.py' \
            --exclude='scripts/sync_upstream.py' \
            --exclude='scripts/generate_finance_skills.py' \
            --exclude='examples/sample_*' \
            --exclude='README_CFO.md' \
            --exclude='THIRD_PARTY_NOTICES.md' \
            --exclude='.hermes.md' \
            --exclude='docs/FINANCE_SKILLS.md' \
            /tmp/hermes-agent/ ./

          cp /tmp/upstream-readme.md UPSTREAM_README.md

      - name: Activate CFOAgent and finance skills
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_finance_skills.py \
            --destination skills/finance-cfo
          python scripts/patch_upstream.py --upstream-sha "$UPSTREAM_SHA"

          test -d optional-skills/finance
          rm -rf skills/finance-official
          mkdir -p skills/finance-official
          cp -a optional-skills/finance/. skills/finance-official/

          if ! grep -q '^# CFOAgent tracked examples$' .gitignore; then
            cat >> .gitignore <<'EOF'

          # CFOAgent tracked examples
          !examples/
          !examples/sample_financials.csv
          !examples/sample_budget.csv
          !examples/sample_long_thai.csv
          !examples/sample_cash_13_week.csv
          !examples/sample_scenarios.json
          EOF
          fi

          python - <<'PY'
          from pathlib import Path
          import subprocess
          from scripts.sync_upstream import is_preserved

          raw = subprocess.check_output(
              ["git", "-C", "/tmp/hermes-agent", "ls-files", "-z"]
          ).decode("utf-8").split("\0")
          imported = sorted(path for path in raw if path and not is_preserved(path))
          Path(".cfo/upstream-files.txt").write_text(
              "\n".join(imported) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify CFOAgent
        shell: bash
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          python -m compileall -q cfo_agent scripts
          python -m unittest discover -s tests/cfo_agent -v

          python -m cfo_agent.cli --home "$RUNNER_TEMP/cfohome" demo \
            --output "$RUNNER_TEMP/board-pack.md"
          python -m cfo_agent.cli --home "$RUNNER_TEMP/cfohome" cash13 \
            examples/sample_cash_13_week.csv \
            --output "$RUNNER_TEMP/cash13.md"
          python -m cfo_agent.cli skills "IFRS 15 revenue recognition" \
            --json --output "$RUNNER_TEMP/skills.json"

          test -s "$RUNNER_TEMP/board-pack.md"
          test -s "$RUNNER_TEMP/cash13.md"
          test -s "$RUNNER_TEMP/skills.json"

          counts_env="$RUNNER_TEMP/cfo-counts.env"
          COUNTS_ENV="$counts_env" python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          cfo = sorted(Path("skills/finance-cfo").glob("*/SKILL.md"))
          official = sorted(Path("skills/finance-official").glob("*/SKILL.md"))
          active = sorted(Path("skills").rglob("SKILL.md"))
          catalog = json.loads(
              Path("skills/finance-cfo/catalog.json").read_text(encoding="utf-8")
          )

          if len(cfo) != 99 or len(catalog) != 99:
              raise SystemExit(
                  f"expected 99 CFO skills, found files={len(cfo)}, catalog={len(catalog)}"
              )
          if len(official) < 8:
              raise SystemExit(
                  f"expected at least 8 official finance skills, found {len(official)}"
              )

          malformed = []
          for path in cfo + official:
              text = path.read_text(encoding="utf-8")
              frontmatter = text.split("---", 2)[1] if text.startswith("---\n") else ""
              if not re.search(r"(?m)^name:\s*\S+", frontmatter):
                  malformed.append(f"{path}: missing name")
              if not re.search(r"(?m)^license:\s*\S+", frontmatter):
                  malformed.append(f"{path}: missing license")
          if malformed:
              raise SystemExit("Malformed finance skills:\n- " + "\n- ".join(malformed))

          Path(os.environ["COUNTS_ENV"]).write_text(
              f"CFO_SKILL_COUNT={len(cfo)}\n"
              f"OFFICIAL_FINANCE_SKILL_COUNT={len(official)}\n"
              f"ACTIVE_SKILL_COUNT={len(active)}\n",
              encoding="ascii",
          )
          print(
              f"verified CFO={len(cfo)}, official={len(official)}, active={len(active)}"
          )
          PY

          source "$counts_env"
          cat "$counts_env" >> "$GITHUB_ENV"
          printf 'passed\nupstream=%s\ncfo_skills=%s\nofficial_finance=%s\nactive_skills=%s\n' \
            "$UPSTREAM_SHA" "$CFO_SKILL_COUNT" \
            "$OFFICIAL_FINANCE_SKILL_COUNT" "$ACTIVE_SKILL_COUNT" \
            > .cfo/bootstrap-status

      - name: Commit complete runtime and CFO system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CFOAgent Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          for sample in examples/sample_*; do
            [[ -f "$sample" ]] && git add -f -- "$sample"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: import Hermes runtime and add 99 CFO finance skills"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Write bootstrap summary
        shell: bash
        run: |
          {
            echo "## CFOAgent bootstrap"
            echo ""
            echo "- Hermes upstream: \`$UPSTREAM_SHA\`"
            echo "- CFO-native finance skills: $CFO_SKILL_COUNT"
            echo "- Official Hermes finance skills: $OFFICIAL_FINANCE_SKILL_COUNT"
            echo "- Total active skills: $ACTIVE_SKILL_COUNT"
            echo "- Deterministic unit tests and CLI smoke tests: passed"
            echo "- Corrupt legacy payload removed from the branch being merged"
          } >> "$GITHUB_STEP_SUMMARY"
